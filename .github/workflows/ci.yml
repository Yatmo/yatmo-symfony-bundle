name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: '8.1'
            symfony: '6.4.*'
          - php: '8.3'
            symfony: '7.3.*'
          - php: '8.4'
            symfony: '8.1.*'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
      - run: composer config policy.advisories.block false
      - run: composer require --no-update --no-interaction "symfony/framework-bundle:${{ matrix.symfony }}" "symfony/twig-bundle:${{ matrix.symfony }}" "symfony/cache:${{ matrix.symfony }}" "symfony/yaml:${{ matrix.symfony }}"
      - run: composer update --no-interaction --prefer-dist
      - run: composer test
